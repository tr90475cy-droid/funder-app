{% extends "base.html" %}
{% block title %}Assignments{% endblock %}
{% block content %}

<div class="app">
  <header class="header">
    <div class="header-brand">
      <a href="{{ url_for('home') }}" class="icon-btn" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div class="header-brand-text">
        <div class="header-brand-name">Assignments</div>
        <div class="header-brand-sub">Lead City University</div>
      </div>
    </div>
    <button class="btn btn-primary btn-sm" id="newAssignBtn">+ Add</button>
  </header>

  <div class="section-label">My <em>deadlines</em></div>
  <div class="assign-list" id="assignList">
    <div class="empty">Loading…</div>
  </div>
</div>

<div class="modal-back" id="assignModal">
  <div class="modal">
    <div class="modal-head">
      <button class="modal-close" id="assignClose">✕</button>
      <div class="modal-title">New Assignment</div>
      <button class="post-btn" id="assignPost">Save</button>
    </div>
    <form id="assignForm">
      <div class="grid-2">
        <div class="field">
          <label>Course code</label>
          <input type="text" name="course_code" placeholder="CSC 301" required>
        </div>
        <div class="field">
          <label>Course title</label>
          <input type="text" name="course_title" placeholder="Data Structures">
        </div>
      </div>
      <div class="field">
        <label>Title</label>
        <input type="text" name="title" placeholder="Binary Tree Implementation" required>
      </div>
      <div class="field">
        <label>Due date &amp; time</label>
        <input type="datetime-local" name="due_date" required>
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea name="description" placeholder="Submission method, requirements…"></textarea>
      </div>

      <div class="field">
        <label>Attachment (optional)</label>
        <input type="file" id="assignFile" name="attachment"
               accept="image/*,.pdf,.doc,.docx,.ppt,.pptx,.txt">
        <p class="field-hint">
          Attach a photo, PDF brief, or document. Max 20MB.
        </p>
      </div>

      <div class="composer-preview hidden" id="assignPreview">
        <img id="assignPreviewImg" alt="">
        <button type="button" class="preview-remove" id="assignPreviewRemove">✕</button>
      </div>

      <div class="assign-file-name hidden" id="assignFileName"></div>
    </form>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/assignments.js') }}"></script>
{% endblock %}
