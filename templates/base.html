<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#22252D">
<meta name="color-scheme" content="dark">

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FUNDAR">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="FUNDAR">

<!-- Social / SEO -->
<meta name="description" content="Campus community for Lead City University students">
<meta property="og:title" content="FUNDAR — Lead City University">
<meta property="og:description" content="Post, chat, buy & sell, and connect with students on campus.">
<meta property="og:type" content="website">
<meta property="og:image" content="/static/icons/icon-512.png">

<title>{% block title %}FUNDAR{% endblock %} — Lead City University</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flashes">
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

{% block content %}{% endblock %}

{% block scripts %}{% endblock %}

<!-- ═══════════ PWA INSTALL BANNER ═══════════ -->
<div class="install-banner hidden" id="installBanner">
  <div class="install-banner-icon">F</div>
  <div class="install-banner-text">
    <div class="install-banner-title">Install FUNDAR</div>
    <div class="install-banner-sub">Add to home screen for the full app experience</div>
  </div>
  <button class="install-banner-btn" id="installBtn">Install</button>
  <button class="install-banner-close" id="installClose" aria-label="Dismiss">✕</button>
</div>

<script>
  // ── Register service worker ──
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => console.log('[PWA] SW registered, scope:', reg.scope))
        .catch((err) => console.warn('[PWA] SW failed:', err));
    });
  }

  // ── Install prompt (Android/Chrome) ──
  let deferredPrompt = null;
  const banner = document.getElementById('installBanner');
  const installBtn = document.getElementById('installBtn');
  const installClose = document.getElementById('installClose');

  const dismissed = sessionStorage.getItem('fundar_install_dismissed');
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;

  if (isStandalone && banner) {
    banner.classList.add('hidden');
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (!dismissed && !isStandalone && banner) {
      setTimeout(() => banner.classList.remove('hidden'), 3000);
    }
  });

  if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log('[PWA] install outcome:', outcome);
      deferredPrompt = null;
      banner.classList.add('hidden');
    });
  }

  if (installClose) {
    installClose.addEventListener('click', () => {
      banner.classList.add('hidden');
      sessionStorage.setItem('fundar_install_dismissed', '1');
    });
  }

  window.addEventListener('appinstalled', () => {
    console.log('[PWA] app installed');
    if (banner) banner.classList.add('hidden');
  });
</script>

</body>
</html>
