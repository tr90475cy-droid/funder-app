{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}

<div class="center-wrap">
  <div class="card">

    <div class="brand-row">
      <div class="brand-mark">F</div>
      <div>
        <div class="brand-name">Fundar</div>
        <div class="brand-sub">Lead City University</div>
      </div>
    </div>

    <h1>Welcome <em>back</em></h1>
    <p class="sub">Sign in to your campus community.</p>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@lcu.edu.ng" required autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
          <button type="button" class="password-toggle" data-target="password" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
              <line x1="2" y1="2" x2="22" y2="22"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <p class="card-footer">
      New here? <a href="{{ url_for('signup') }}">Create an account</a>
    </p>

  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
